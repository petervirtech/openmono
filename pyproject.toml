[project]
name = "cbs-pm-buddy"
version = "0.1.0"
description = "A project management buddy built with FastAPI"
readme = "README.md"
authors = [
    { name = "Piet", email = "piet@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
cbs-pm-buddy = "cbs_pm_buddy:app"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
